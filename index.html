<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tricycle Franchise - Sign In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #1B2A4A;
      --navy-dark: #16223c;
      --blue: #2456C7;
      --blue-dark: #1d47ab;
      --text-gray: #5B6472;
      --border-gray: #E3E5E9;
      --field-bg: #EDEEF1;
      --card-bg: #F7F8FA;
      --danger-bg: #fde8e8;
      --danger-text: #b42318;
      --danger-border: #f1b4b4;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: 'Poppins', sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-height: 100vh;
      min-height: 100svh;
      padding: 40px;
      background: #b7bcc4 url('assets/bgimage.png') center center / cover no-repeat;
    }

    .login-card {
      width: 100%;
      max-width: 720px;
      background: rgba(247, 248, 250, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.52);
      border-radius: 18px;
      box-shadow: 0 25px 60px rgba(20, 28, 46, 0.3);
      padding: 56px 64px 40px;
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }

    .login-card h1 {
      margin: 0 0 14px;
      font-size: 42px;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: -0.5px;
    }

    .login-card .subtitle {
      margin: 0 0 24px;
      font-size: 18px;
      color: var(--text-gray);
      font-weight: 400;
    }

    .alert {
      margin-bottom: 18px;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
      font-size: 14px;
      font-weight: 500;
    }

    label {
      display: block;
      font-size: 17px;
      font-weight: 600;
      color: var(--navy);
      margin-bottom: 10px;
    }

    .field-group {
      margin-bottom: 22px;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      background: var(--field-bg);
      border: 1px solid var(--border-gray);
      border-radius: 10px;
      padding: 14px 18px;
      gap: 12px;
    }

    .input-wrapper svg {
      flex-shrink: 0;
      color: #6B7280;
    }

    .input-wrapper input {
      border: none;
      background: transparent;
      outline: none;
      font-family: 'Poppins', sans-serif;
      font-size: 16px;
      color: var(--navy);
      width: 100%;
    }

    .input-wrapper input::placeholder {
      color: #8A93A3;
      font-weight: 400;
    }

    .password-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 4px 0 4px 8px;
      border: none;
      background: transparent;
      color: var(--blue);
      cursor: pointer;
    }

    .password-toggle svg {
      display: block;
      width: 20px;
      height: 20px;
    }

    .password-toggle svg[hidden] { display: none; }

    .password-toggle:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 3px;
      border-radius: 2px;
    }

    .forgot-row {
      text-align: right;
      margin-bottom: 22px;
    }

    .forgot-row a {
      color: var(--blue);
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
    }

    .forgot-row a:hover {
      text-decoration: underline;
    }

    .sign-in-btn {
      width: 100%;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 18px;
      font-family: 'Poppins', sans-serif;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .sign-in-btn:hover {
      background: var(--blue-dark);
    }

    .sign-in-btn:disabled { opacity: .82; cursor: wait; }
    .sign-in-spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      margin: 0 9px -4px 0;
      border: 2px solid rgba(255,255,255,.5);
      border-top-color: #fff;
      border-radius: 50%;
      animation: login-spin .8s linear infinite;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border-gray);
      margin: 28px 0 20px;
    }

    .footer-note {
      text-align: center;
      color: #9096A2;
      font-size: 14px;
    }

    .login-progress {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(16, 26, 61, 0.62);
      padding: 24px;
    }

    .login-progress[hidden] { display: none; }

    .login-progress-card {
      width: 100%;
      max-width: 360px;
      padding: 32px 24px;
      border-radius: 18px;
      background: #fff;
      color: var(--navy);
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.24);
    }

    .login-progress-spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 18px;
      border: 4px solid #dce4f5;
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: login-spin .8s linear infinite;
    }

    .login-progress-message { margin: 0; font-size: 17px; font-weight: 700; }
    .login-progress-detail { margin: 8px 0 0; color: var(--text-gray); font-size: 13px; }
    @keyframes login-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .login-progress-spinner { animation-duration: 2s; } }

    @media (max-width: 600px) {
      body { justify-content: center; padding: 20px; }
      .login-card { padding: 36px 28px 28px; }
      .login-card h1 { font-size: 32px; }
    }
  </style>
</head>
<body>
  <div class="login-progress" id="login-progress" role="status" aria-live="polite" hidden>
    <div class="login-progress-card">
      <div class="login-progress-spinner" aria-hidden="true"></div>
      <p class="login-progress-message">Login successful. Welcome back!</p>
      <p class="login-progress-detail">Opening your dashboard…</p>
    </div>
  </div>
  <div class="login-card">
    <h1>Welcome Back!</h1>
    <p class="subtitle">Please sign in to your admin account.</p>

    <form method="post" action="controllers/index.php" novalidate>
      <div class="field-group">
        <label for="email">Email Address / Username</label>
        <div class="input-wrapper">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
          <input type="text" id="email" name="email" placeholder="Enter your email or username" required>
        </div>
      </div>

      <div class="field-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
          <button type="button" class="password-toggle" id="password-toggle" aria-label="Show password" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
              <path d="M3 10c2.2 3.5 5.2 5.5 9 5.5s6.8-2 9-5.5"></path>
              <path d="m6 11-1 2"></path>
              <path d="m12 15.5v2"></path>
              <path d="m18 11 1 2"></path>
            </svg>
          </button>
        </div>
      </div>


      <button type="submit" class="sign-in-btn">Sign In</button>

      <hr class="divider">
      <p class="footer-note">© Tricycle Management System</p>
    </form>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const error = params.get('error');
    const form = document.querySelector('form');
    const loginProgress = document.getElementById('login-progress');
    const password = document.getElementById('password');
    const passwordToggle = document.getElementById('password-toggle');
    const passwordIcons = passwordToggle.querySelectorAll('svg');

    passwordToggle.addEventListener('click', () => {
      const isVisible = password.type === 'text';
      password.type = isVisible ? 'password' : 'text';
      passwordToggle.setAttribute('aria-label', isVisible ? 'Show password' : 'Hide password');
      passwordToggle.setAttribute('aria-pressed', String(!isVisible));
      passwordIcons[0].hidden = !isVisible;
      passwordIcons[1].hidden = isVisible;
    });

    if (params.get('login') === 'success') {
      loginProgress.hidden = false;
      window.setTimeout(() => window.location.replace('admin/dashboard.html'), 3000);
    } else if (form) {
      form.addEventListener('submit', () => {
        const button = form.querySelector('button[type="submit"]');
        button.disabled = true;
        button.setAttribute('aria-busy', 'true');
        button.innerHTML = '<span class="sign-in-spinner" aria-hidden="true"></span>Signing in…';
      });
    }

    if (error && form && params.get('login') !== 'success') {
      const alertBox = document.createElement('div');
      alertBox.className = 'alert';
      alertBox.textContent = error === 'missing'
        ? 'Please enter your email or username and password.'
        : error === 'restricted'
          ? 'This account is not authorized for the Super Admin portal.'
          : 'Invalid email/username or password.';
      form.insertBefore(alertBox, form.firstChild);
    }
  </script>
</body>
</html>
