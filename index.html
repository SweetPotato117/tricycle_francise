<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tricycle Franchise - Sign In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #1B2A4A;
      --navy-dark: #16223c;
      --blue: #2456C7;
      --blue-dark: #1d47ab;
      --text-gray: #5B6472;
      --border-gray: #E3E5E9;
      --field-bg: #EDEEF1;
      --card-bg: #F7F8FA;
      --danger-bg: #fde8e8;
      --danger-text: #b42318;
      --danger-border: #f1b4b4;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Poppins', sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-height: 100vh;
      padding: 40px;
      background-image: url('/assets/bgimage.png');
      background-size: cover;
      background-position: center;
      background-color: #b7bcc4;
    }

    .login-card {
      width: 100%;
      max-width: 720px;
      background: var(--card-bg);
      border-radius: 18px;
      box-shadow: 0 25px 60px rgba(20, 28, 46, 0.25);
      padding: 56px 64px 40px;
    }

    .login-card h1 {
      margin: 0 0 14px;
      font-size: 42px;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: -0.5px;
    }

    .login-card .subtitle {
      margin: 0 0 24px;
      font-size: 18px;
      color: var(--text-gray);
      font-weight: 400;
    }

    .alert {
      margin-bottom: 18px;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
      font-size: 14px;
      font-weight: 500;
    }

    label {
      display: block;
      font-size: 17px;
      font-weight: 600;
      color: var(--navy);
      margin-bottom: 10px;
    }

    .field-group {
      margin-bottom: 22px;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      background: var(--field-bg);
      border: 1px solid var(--border-gray);
      border-radius: 10px;
      padding: 14px 18px;
      gap: 12px;
    }

    .input-wrapper svg {
      flex-shrink: 0;
      color: #6B7280;
    }

    .input-wrapper input {
      border: none;
      background: transparent;
      outline: none;
      font-family: 'Poppins', sans-serif;
      font-size: 16px;
      color: var(--navy);
      width: 100%;
    }

    .input-wrapper input::placeholder {
      color: #8A93A3;
      font-weight: 400;
    }

    .forgot-row {
      text-align: right;
      margin-bottom: 22px;
    }

    .forgot-row a {
      color: var(--blue);
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
    }

    .forgot-row a:hover {
      text-decoration: underline;
    }

    .sign-in-btn {
      width: 100%;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 18px;
      font-family: 'Poppins', sans-serif;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .sign-in-btn:hover {
      background: var(--blue-dark);
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border-gray);
      margin: 28px 0 20px;
    }

    .footer-note {
      text-align: center;
      color: #9096A2;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      body { justify-content: center; padding: 20px; }
      .login-card { padding: 36px 28px 28px; }
      .login-card h1 { font-size: 32px; }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Welcome Back!</h1>
    <p class="subtitle">Please sign in to your admin account.</p>

    <form method="post" action="controllers/index.php" novalidate>
      <div class="field-group">
        <label for="email">Email Address / Username</label>
        <div class="input-wrapper">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
          <input type="text" id="email" name="email" placeholder="Enter your email or username" required>
        </div>
      </div>

      <div class="field-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>
      </div>

      <div class="forgot-row">
        <a href="#">Forgot Password?</a>
      </div>

      <button type="submit" class="sign-in-btn">Sign In</button>

      <hr class="divider">
      <p class="footer-note">© Tricycle Management System</p>
    </form>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const error = params.get('error');
    const form = document.querySelector('form');

    if (error && form) {
      const alertBox = document.createElement('div');
      alertBox.className = 'alert';
      alertBox.textContent = error === 'missing'
        ? 'Please enter your email or username and password.'
        : 'Invalid email/username or password.';
      form.insertBefore(alertBox, form.firstChild);
    }
  </script>
</body>
</html>
