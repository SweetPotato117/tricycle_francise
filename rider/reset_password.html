<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>Reset Password — Franchise Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/rider_app.css?v=20261013">
</head>
<body>
  <main class="login-screen">
    <section class="login-panel">
      <div class="login-wrap">
        <div class="login-heading">
          <h2>Reset your password</h2>
          <p>Choose a new password for your account. The reset link can only be used once.</p>
        </div>

        <div class="login-reset-status" id="reset-status" role="status" aria-live="polite"></div>

        <form id="reset-form" novalidate>
          <div class="login-field">
            <label for="new-password">New Password</label>
            <div class="login-input-group">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              <input type="password" id="new-password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>
            </div>
          </div>

          <div class="login-field">
            <label for="confirm-password">Confirm New Password</label>
            <div class="login-input-group">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              <input type="password" id="confirm-password" placeholder="Re-enter your new password" autocomplete="new-password" minlength="8" required>
            </div>
          </div>

          <button type="submit" class="login-submit" id="reset-submit">Update Password</button>
        </form>

        <div class="login-row login-reset-back">
          <a class="login-forgot" href="rider_app.html">Back to sign in</a>
        </div>

        <div class="login-footer">
          <p>Tricycle Franchise Management System</p>
        </div>
      </div>
    </section>
  </main>
  <script src="js/reset_password.js?v=20261110-password-notifications" defer></script>
</body>
</html>
